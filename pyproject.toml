[project]
name = "paper"
version = "0.1.0"
description = "AI-powered LibreOffice extension with async-safe UNO integration and multi-provider AI orchestration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.13.5",
    "cryptography>=48.0.0",
    "google-generativeai>=0.8.6",
    "openai>=2.38.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "isort>=8.0.1",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]
